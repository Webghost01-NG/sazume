name: Bug report
description: Report a reproducible Sazume defect
body:
  - type: markdown
    attributes:
      value: Do not include private keys, seed phrases, credentials, or private RPC URLs.
  - type: input
    id: version
    attributes:
      label: Sazume version or commit
      placeholder: 0.1.0-rc.1 or commit SHA
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include a minimal reproduction and relevant sanitized output.
    validations:
      required: true
